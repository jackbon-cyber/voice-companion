[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# 仓库根目录加入 sys.path，使 `core.protocol...` 这类绝对导入可用
# （rootdir 是 core/，其父目录默认不在搜索路径上）。
pythonpath = ..
addopts = -q --strict-markers
markers =
    slow: 需要拉起子进程或外部服务的慢速用例（端到端、跨进程集成）
    # 标记必须显式声明 —— --strict-markers 会拒绝未注册的标记，
    # 否则拼错标记名会静默变成"永远不执行"，用例会假装通过。
